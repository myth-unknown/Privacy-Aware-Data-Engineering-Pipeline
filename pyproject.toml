[project]
name = "privacy-aware-data-engineering-pipeline"
version = "0.1.0"
description = "Research-oriented data engineering and privacy preservation system with experimental PII detection comparison"
authors = [
    {name = "myth-unknown"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["privacy", "data-engineering", "pii-detection", "anonymization", "research"]

[project.urls]
Homepage = "https://github.com/myth-unknown/Privacy-Aware-Data-Engineering-Pipeline"
Repository = "https://github.com/myth-unknown/Privacy-Aware-Data-Engineering-Pipeline"
Documentation = "https://github.com/myth-unknown/Privacy-Aware-Data-Engineering-Pipeline/blob/main/README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/*" = ["N802", "N803"]  # Allow non-lowercase functions in tests

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
